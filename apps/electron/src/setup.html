<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>日序初始化</title>
    <link rel="stylesheet" href="./setup.css" />
  </head>
  <body>
    <main class="setup-shell">
      <section class="setup-panel">
        <img class="logo" src="../assets/dayorder.png" alt="" />
        <p class="eyebrow">DayOrder Desktop</p>
        <h1>选择你的日序工作区</h1>
        <p class="summary">数据仍保存在本地 SQLite 和上传文件夹中。把工作区放在 OneDrive 里，就能延续现在的同步方式。</p>
        <div class="actions">
          <button id="defaultBtn" class="primary" type="button">使用默认工作区</button>
          <button id="newBtn" type="button">新建工作区</button>
          <button id="existingBtn" type="button">打开已有工作区</button>
        </div>
        <dl class="path-list">
          <div>
            <dt>默认位置</dt>
            <dd id="defaultPath">-</dd>
          </div>
          <div>
            <dt>启动状态</dt>
            <dd id="status">等待选择</dd>
          </div>
        </dl>
        <div class="footer-actions">
          <button id="logsBtn" class="text-button" type="button">打开日志目录</button>
          <button id="workspaceBtn" class="text-button" type="button">打开当前工作区</button>
        </div>
      </section>
    </main>
    <script src="./setup.js"></script>
  </body>
</html>
